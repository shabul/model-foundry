[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-decision-encoder"
version = "0.1.0"
license = "Apache-2.0"
description = "Runtime-option-conditioned probabilistic decisions with a bidirectional encoder"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6,<3", "transformers>=4.48,<5", "datasets>=3,<5", "numpy>=1.26", "pyyaml>=6", "safetensors>=0.4", "scipy>=1.12", "sentencepiece>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/decision_encoder"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
